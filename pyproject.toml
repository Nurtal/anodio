[project]
name = "anodio"
version = "0.1.0"
description = "Anonymisation de la voix avec évaluation Privacy / utilité"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "PySide6>=6.6",
    "praat-parselmouth>=0.4.7",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "speechbrain>=1.1.1",
    "huggingface-hub>=0.30,<2",
    "faster-whisper>=1.1",
    "tokenizers>=0.20",
]

[project.scripts]
anodio = "anodio.cli.main:main"
anodio-gui = "anodio.gui.main:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: utilise les vrais modèles (ECAPA, Whisper)"]
addopts = "-m 'not slow'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
